schema: spec-driven
context: |
  Proyecto Tribe Sport. Backend Python Django y despliegue en Railway.
  Inspeccionar frontend, versiones, configuracion y comandos existentes; no asumir Angular.
  Usar la politica SDD de AI-Workspace en la revision registrada por el proyecto.
  Para explorar codigo usar CodeGraph si hay indice/acceso, con projectPath explicito y contexto acotado; comprobar la raiz resuelta.
  Documentacion ligera con trazabilidad completa; no exigir los formularios F0-F5 de SITOP V2.
  Identidad deportiva vibrante con interfaz limpia; consultar referencia de marca del proyecto.
  Escribir artefactos en espanol preservando sintaxis normativa de OpenSpec.
rules:
  proposal:
    - Documentar objetivo, alcance, exclusiones y criterios de aceptacion sin inventar reglas de negocio.
  specs:
    - Mantener IDs y escenarios verificables para funcionalidades, permisos, validaciones y errores aplicables.
  design:
    - Registrar impacto en modelos/migraciones, frontend existente, seguridad y servicios Railway afectados.
    - Conservar legibilidad y jerarquia limpia con colores vibrantes del tema de marca confirmado.
  tasks:
    - Vincular requisitos con implementacion, pruebas reales y evidencia; justificar verificaciones no aplicables.
    - Preparar notas de liberacion, configuracion sin secretos y rollback proporcional; no desplegar por inferencia.
